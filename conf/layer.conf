# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
        ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ocaml-layer"
BBFILE_PATTERN_ocaml-layer = "^${LAYERDIR}/"
BBFILE_PRIORITY_ocaml-layer = "6"

LAYERVERSION_ocaml-layer = "2"

#LAYERDEPENDS_ocaml-layer = ""

# walnascar branch - updated for modern BitBake override syntax
# For older releases (sumo, dunfell), use master branch
LAYERSERIES_COMPAT_ocaml-layer = "walnascar"

# Add common licenses directory for QPL license
COMMON_LICENSE_DIR:prepend := "${LAYERDIR}/files/common-licenses:"
